[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visafilla"
version = "0.1.0"
description = "Free, private helper for completing the Spanish Schengen visa application PDF, entirely in the browser."
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF==1.28.2",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.12.0",
    "playwright==1.63.0",
]

[tool.hatch.build.targets.wheel]
packages = ["script", "webapp"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "E701", "E702"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["script/tests", "webapp/tests"]
